<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="530" viewBox="0 0 1140 530" font-family="Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/></marker></defs>
<rect width="1140" height="530" fill="#ffffff"/>
<text x="40" y="44" font-size="20" font-weight="600" fill="#16181d">DebugProbe — Versorgung des Prototyps</text>
<text x="40" y="66" font-size="13" fill="#6b7280">Vom KNX-Bus zum ESP32-S3, mit galvanischer Trennung vor dem Controller</text>
<text x="610" y="112" font-size="12" font-weight="600" fill="#b3261e" text-anchor="middle">galvanische Trennung</text>
<line x1="610" y1="122" x2="610" y2="168" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="7 6"/>
<line x1="610" y1="260" x2="610" y2="282" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="596" y="146" font-size="11" fill="#c4736c" text-anchor="end">Busseite</text>
<text x="624" y="146" font-size="11" fill="#c4736c">Geräteseite</text>
<rect x="40" y="168" width="130" height="92" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="105" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">KNX-Klemme</text>
<text x="105" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">rot/schwarz oder</text>
<text x="105" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">gelb/weiß</text>
<line x1="170" y1="214" x2="206" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="190" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">KNX+</text>
<line x1="210" y1="214" x2="238" y2="214" stroke="#4b5563" stroke-width="2"/>
<polygon points="238,201 238,227 262,214" fill="#1f6feb"/>
<line x1="262" y1="201" x2="262" y2="227" stroke="#1f6feb" stroke-width="3"/>
<line x1="262" y1="214" x2="292" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="250" y="182" font-size="13" font-weight="600" fill="#1f4fa8" text-anchor="middle">SK54</text>
<text x="250" y="250" font-size="10.5" fill="#9aa1ad" text-anchor="middle">Rückwirkungs-</text>
<text x="250" y="266" font-size="10.5" fill="#9aa1ad" text-anchor="middle">freiheit zum Bus</text>
<text x="250" y="284" font-size="10.5" font-weight="600" fill="#8a6100" text-anchor="middle">nur 40 V Sperrsp.</text>
<rect x="296" y="168" width="170" height="92" rx="9" fill="#fdf9ee" stroke="#e6d5a8" stroke-width="1.6"/>
<text x="381" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">DC-DC-Wandler</text>
<text x="381" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">nicht isoliert, 29 V → 5 V</text>
<text x="381" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">Modul: max 30 V</text>
<line x1="466" y1="214" x2="518" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="494" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">5 V</text>
<rect x="522" y="168" width="176" height="92" rx="9" fill="#f4f7fd" stroke="#cbd2db" stroke-width="1.6"/>
<text x="610" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">B0505S-1W</text>
<text x="610" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">isolierender Brick</text>
<text x="610" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">5 V → 5 V, 1 W</text>
<line x1="698" y1="214" x2="750" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="726" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">5 V</text>
<rect x="754" y="168" width="156" height="92" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="832" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">ESP32-S3</text>
<text x="832" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">die Probe</text>
<text x="832" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">rund 1 W</text>
<line x1="910" y1="214" x2="962" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="938" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">USB-C</text>
<rect x="966" y="168" width="134" height="92" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="1033" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">Zielgerät</text>
<text x="1033" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">OpenKNX</text>
<text x="1033" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">bus-versorgt</text>
<rect x="512" y="300" width="196" height="46" rx="7" fill="#f2faf5" stroke="#bfe3cd" stroke-width="1.4"/>
<text x="610" y="320" font-size="12" font-weight="600" fill="#1a7f4b" text-anchor="middle">gemessen: 4,9 V unter Last</text>
<text x="610" y="337" font-size="10.5" fill="#5d7d6b" text-anchor="middle">Genauigkeit unkritisch</text>
<circle cx="48" cy="376" r="3.5" fill="#1f6feb"/>
<text x="62" y="380" font-size="11.5" font-weight="600" fill="#16181d">Warum die Schottky</text>
<text x="230" y="380" font-size="11" fill="#7c8493">Rückwirkungsfreiheit. KNX überträgt durch kurzzeitiges LOW-Ziehen des Busses — aus dem</text>
<text x="230" y="401" font-size="11" fill="#7c8493">Eingangskondensator des DC-DC darf dabei keine Ladung zurückfließen.</text>
<circle cx="48" cy="418" r="3.5" fill="#1f6feb"/>
<text x="62" y="422" font-size="11.5" font-weight="600" fill="#16181d">Warum die Trennung</text>
<text x="230" y="422" font-size="11" fill="#7c8493">Bricht die Masseschleife zwischen Busversorgung und Zielgerät. Einziger Massebezug: das USB-Kabel.</text>
<circle cx="48" cy="439" r="3.5" fill="#1f6feb"/>
<text x="62" y="443" font-size="11.5" font-weight="600" fill="#16181d">Spannung unkritisch</text>
<text x="230" y="443" font-size="11" fill="#7c8493">Alles über etwa 4 V genügt. VBUS ist nur Erkennungssignal, das Ziel hängt selbst am Bus.</text>
<circle cx="48" cy="460" r="3.5" fill="#1f6feb"/>
<text x="62" y="464" font-size="11.5" font-weight="600" fill="#16181d">Offen: >40 V nötig</text>
<text x="230" y="464" font-size="11" fill="#7c8493">Damit die Probe an rot/schwarz und an gelb/weiß laufen kann. Das aktuelle Modul kann nur 30 V</text>
<text x="230" y="485" font-size="11" fill="#7c8493">absolute maximum — am 29-V-Bus also ohne Reserve. Dann wird auch die SK54 (40 V) zu knapp.</text>
<circle cx="48" cy="502" r="3.5" fill="#1f6feb"/>
<text x="62" y="506" font-size="11.5" font-weight="600" fill="#16181d">Leistungsgrenze</text>
<text x="230" y="506" font-size="11" fill="#7c8493">1 W des B0505 gegen rund 1 W Bedarf des S3. Für einen USB-gespeisten Prüfling reicht das nicht.</text>
</svg>