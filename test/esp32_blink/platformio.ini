; Blink-Testfirmware fuer ein ESP32-Zielgeraet.
;
; Der eigentliche Punkt an dieser Datei sind die beiden letzten Zeilen: Upload
; und Monitor laufen ueber die DebugProbe, nicht ueber ein USB-Kabel. esptool
; laeuft weiterhin auf dem PC und redet nur durch die Probe hindurch.
;
;   pio run -d test/esp32_blink -t upload
;
; Unter Windows vorher PYTHONIOENCODING=utf-8 setzen, sonst bricht esptool
; beim Fortschrittsbalken mit UnicodeEncodeError ab.
;
; <xxxx> durch den eigenen Probe-Namen ersetzen. Die passenden Zeilen liefert
; die Probe auch fertig aus:  curl http://<probe>.local/api/snippet

[env:esp32dev]
platform  = espressif32@54.3.21
board     = esp32dev
framework = arduino

; 460800 ist am Geraet mehrfach reproduziert (App-Schreibphase 6,3 s statt
; 16,9 s bei 115200). 921600 lief einmal schneller und brach danach einmal ab.
upload_speed  = 460800
monitor_speed = 115200
upload_port   = rfc2217://openknx-probe-xxxx.local:4000
monitor_port  = socket://openknx-probe-xxxx.local:2323
