; Testfirmware fuer das RP2040-Zielgeraet.
;
; Zweck: eine bekannte, harmlose UF2 zum Pruefen des Flash-Pfads der Probe,
; die anschliessend im Sekundentakt ueber USB-CDC schreibt — damit laesst sich
; in einem Durchgang das Flashen (Stufe 4) und die Konsolenbruecke (Stufe 3)
; verifizieren.
;
; Bauen:   pio run -d test/pico_heartbeat
; Flashen: curl --fail-with-body --data-binary "@test/pico_heartbeat/.pio/build/pico/firmware.uf2" \
;               http://openknx-probe-<mac>.local/api/flash

[env:pico]
platform  = raspberrypi
board     = pico
framework = arduino

build_flags =
    -DPICO_HEARTBEAT
