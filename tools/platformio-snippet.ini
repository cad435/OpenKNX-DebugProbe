; ---------------------------------------------------------------------------
; Einbindung der DebugProbe in ein OpenKNX-Zielprojekt
;
; Damit laufen `pio run -t upload` und `pio device monitor` ganz normal, nur
; eben über WLAN statt über ein USB-Kabel. Kein Isolierwandler, keine
; Verlängerung, kein Umstecken.
;
; <probe> durch den Gerätenamen ersetzen (Default openknx-probe-<mac>).
;
; Schneller als abschreiben: die Probe liefert die zum angesteckten Ziel
; passenden Zeilen selbst aus, mit ihrem eigenen Namen schon eingesetzt:
;     curl http://<probe>.local/api/snippet
; Im Web-UI stehen dieselben Zeilen in zwei Kopierfeldern.
; ---------------------------------------------------------------------------

[env:openknx_via_probe]
; ... board / framework wie im Zielprojekt ...

; Konsole des Zielgeräts über die Probe. Die Verbindung überlebt Resets des
; Ziels, und beim Verbinden kommt der Mitschnitt nach — inklusive der
; Boot-Meldungen, die am direkten USB-Kabel verloren gehen.
monitor_port = socket://openknx-probe-xxxx.local:2323

; Flashen über die Probe. Die UF2 wird erst vollständig geprüft und dann
; geschrieben; eine kaputte Datei erreicht das Zielgerät gar nicht.
;
; Voraussetzung: das Ziel steht im BOOTSEL-Modus (am Gerät BOOTSEL halten,
; RUN kurz drücken). Der Zustand ist im Web-UI der Probe sichtbar.
;
; Nicht $SOURCE verwenden! PlatformIO löst das bei upload_protocol = custom auf
; die firmware.bin auf, und die lehnt /api/flash zu Recht ab (kein UF2-Magic).
; Die Klammern um ${PROGNAME} sind Pflicht — "$PROGNAME.uf2" liest SCons als
; Attributzugriff und bricht mit einem AttributeError ab.
; --fail-with-body statt -f: sonst verschluckt curl den Grund der Ablehnung und
; im Log steht nur "curl: (22)".
upload_protocol = custom
upload_command  = curl --fail-with-body --data-binary "@$BUILD_DIR/${PROGNAME}.uf2" http://openknx-probe-xxxx.local/api/flash

; Nur prüfen, ohne zu schreiben:
;   curl "http://openknx-probe-xxxx.local/api/flash?validate_only=1" --data-binary "@firmware.uf2"
;
; Der Pfad der UF2 im Zielprojekt, falls man ihn von Hand braucht:
;   .pio/build/<env>/firmware.uf2

; ---------------------------------------------------------------------------
; Variante fuer ESP32-Zielgeraete (klassischer ESP32 mit UART-Bridge)
;
; Hier laeuft esptool weiter auf dem PC und redet nur durch die Probe hindurch.
; Ueber RFC2217 kommen Baudrate und DTR/RTS mit durch, damit funktioniert auch
; der Auto-Reset in den Bootloader.
; ---------------------------------------------------------------------------
;
; upload_port   = rfc2217://openknx-probe-xxxx.local:4000
; upload_speed  = 460800
; monitor_port  = socket://openknx-probe-xxxx.local:2323
;
; Zur Baudrate: 460800 ist dreimal in Folge reproduziert (App-Write 6,3 s statt
; 16,9 s bei 115200). 921600 war einmal noch schneller, danach aber einmal
; abgebrochen — bis das geklaert ist, bleibt 460800 die Empfehlung.
;
; oder direkt:
;   esptool --port rfc2217://openknx-probe-xxxx.local:4000 -b 460800 write-flash 0x0 firmware.bin
