; OpenKNX DebugProbe — PlatformIO
;
; Framework ist ESP-IDF (nicht Arduino): der USB-Host-Stack, den die Probe
; spaeter braucht, existiert nur dort. Gebaut wird mit der lokal installierten
; pioarduino-Plattform 54.3.21 (ESP-IDF 5.4.2).
;
; Hardware: ESP32-S3FH4R2 — 4 MB embedded Flash, 2 MB PSRAM quad.

[platformio]
default_envs = probe

[env:probe]
platform  = espressif32@54.3.21
board     = esp32-s3-devkitc1-n4r2
framework = espidf

; Die Board-Definition der Plattform meldet faelschlich 8 MB Flash
; (upload.flash_size = "8MB" bei maximum_size = 4194304). Korrigiert:
board_upload.flash_size = 4MB

; PSRAM und OTA-Rollback stehen in sdkconfig.defaults.
; Die Partitionstabelle wird zusaetzlich hier angegeben, damit PlatformIO den
; App-Offset aus der CSV ableitet statt seinen Default (0x10000) anzunehmen.
board_build.partitions = partitions.csv

; PlatformIO unterstuetzt EMBED_TXTFILES von ESP-IDF nicht — das Skript
; uebersetzt components/*/web/*.html vor dem Build in C++-Header.
extra_scripts = pre:tools/embed_web.py

; Serieller Port bleibt offen — PlatformIO sucht ihn selbst. Nur eintragen, wenn
; mehrere Geraete stecken (z. B. upload_port = COM7 bzw. /dev/ttyACM0).
; upload_port   = COM7
; monitor_port  = COM7
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
