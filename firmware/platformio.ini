; OpenKNX DebugProbe — PlatformIO
;
; Framework ist ESP-IDF (nicht Arduino): der USB-Host-Stack, den die Probe
; spaeter braucht, existiert nur dort. Gebaut wird mit der lokal installierten
; pioarduino-Plattform 54.3.21 (ESP-IDF 5.4.2).
;
; Hardware: ESP32-S3FH4R2 — 4 MB embedded Flash, 2 MB PSRAM quad.

[platformio]
default_envs = probe

[env:probe]
platform  = espressif32@54.3.21
board     = esp32-s3-devkitc1-n4r2
framework = espidf

; Das esptool, das die Plattform mitbringt (5.0.0-dev1), stirbt gegen das
; aktuelle click: ParamType.get_metavar() hat ein Argument dazubekommen. Der
; Fehler kommt nicht beim Upload, sondern beim Erzeugen der firmware.bin —
; der Build laeuft also bis zum Linken durch und bricht danach ab.
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.0.2/esptool.zip

; Die Board-Definition der Plattform meldet faelschlich 8 MB Flash
; (upload.flash_size = "8MB" bei maximum_size = 4194304). Korrigiert:
board_upload.flash_size = 4MB

; PSRAM und OTA-Rollback stehen in sdkconfig.defaults.
; Die Partitionstabelle wird zusaetzlich hier angegeben, damit PlatformIO den
; App-Offset aus der CSV ableitet statt seinen Default (0x10000) anzunehmen.
board_build.partitions = partitions.csv

; PlatformIO unterstuetzt EMBED_TXTFILES von ESP-IDF nicht — embed_web.py
; uebersetzt components/*/web/*.html vor dem Build in C++-Header. Das
; betrifft nur noch die kleine Notfallseite und das WLAN-Portal.
extra_scripts =
    pre:tools/embed_web.py
    post:tools/ota_upload.py

; ---------------------------------------------------------------------------
; Hochgeladen wird ueber WLAN, nicht seriell.
;
; Das ist der Normalfall fuer dieses Geraet: der USB-C der Probe haengt am
; Pruefling, nicht am PC. `tools/ota_upload.py` schickt deshalb
;     pio run -t upload     -> firmware.bin  an POST /api/update  (OTA, Rollback)
;     pio run -t uploadfs   -> littlefs.bin  an POST /api/fs      (Oberflaeche)
;
; Den Namen der eigenen Probe hier eintragen (steht im Web-UI oben):
; custom_ota_host = openknx-probe-xxxx.local
;
; ZURUECK AUF SERIELL — noetig fuer die Partitionstabelle (ein Subtype-Wechsel
; aendert die Tabelle bei 0x8000 und geht nicht ueber das Netz) und zum Retten
; einer Probe, die nicht mehr erreichbar ist: die Zeile `upload_protocol` unten
; auskommentieren und `post:tools/ota_upload.py` oben entfernen.
upload_protocol = custom


; Die eigentliche Oberflaeche liegt in data/ und wird NICHT ins Image
; gelinkt, sondern als LittleFS in die Partition `storage` geschrieben:
;     pio run -t buildfs     data/ -> .pio/build/probe/littlefs.bin
;     pio run -t uploadfs    schiebt es an POST /api/fs (oder seriell nach
;                            0x3D0000, wenn der OTA-Weg abgeschaltet ist)
; Die Plattform findet die Partition ueber den Subtype `littlefs` und
; setzt Page/Block selbst auf 256/4096 — passend zu esp_littlefs.
;
; `/api/update` (OTA) schreibt nur App-Partitionen; `storage` ist darueber
; NICHT erreichbar — dafuer gibt es den eigenen Endpunkt `/api/fs`.
board_build.filesystem = littlefs

; Serieller Port bleibt offen — PlatformIO sucht ihn selbst. Nur eintragen, wenn
; mehrere Geraete stecken (z. B. upload_port = COM7 bzw. /dev/ttyACM0).
; upload_port   = COM7
; monitor_port  = COM7
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
