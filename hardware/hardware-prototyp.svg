<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="530" viewBox="0 0 1140 530" font-family="Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/></marker></defs>
<rect width="1140" height="530" fill="#ffffff"/>
<text x="40" y="44" font-size="20" font-weight="600" fill="#16181d">DebugProbe — Prototype power supply</text>
<text x="40" y="66" font-size="13" fill="#6b7280">From the KNX bus to the ESP32-S3, with galvanic isolation ahead of the controller</text>
<text x="610" y="112" font-size="12" font-weight="600" fill="#b3261e" text-anchor="middle">galvanic isolation</text>
<line x1="610" y1="122" x2="610" y2="168" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="7 6"/>
<line x1="610" y1="260" x2="610" y2="282" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="596" y="146" font-size="11" fill="#c4736c" text-anchor="end">bus side</text>
<text x="624" y="146" font-size="11" fill="#c4736c">device side</text>
<rect x="40" y="168" width="130" height="92" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="105" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">KNX terminal</text>
<text x="105" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">red/black or</text>
<text x="105" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">yellow/white</text>
<line x1="170" y1="214" x2="206" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="190" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">KNX+</text>
<line x1="210" y1="214" x2="238" y2="214" stroke="#4b5563" stroke-width="2"/>
<polygon points="238,201 238,227 262,214" fill="#1f6feb"/>
<line x1="262" y1="201" x2="262" y2="227" stroke="#1f6feb" stroke-width="3"/>
<line x1="262" y1="214" x2="292" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="250" y="182" font-size="13" font-weight="600" fill="#1f4fa8" text-anchor="middle">SK54</text>
<text x="250" y="250" font-size="10.5" fill="#9aa1ad" text-anchor="middle">no back-</text>
<text x="250" y="266" font-size="10.5" fill="#9aa1ad" text-anchor="middle">feeding to the bus</text>
<text x="250" y="284" font-size="10.5" font-weight="600" fill="#8a6100" text-anchor="middle">only 40 V reverse</text>
<rect x="296" y="168" width="170" height="92" rx="9" fill="#fdf9ee" stroke="#e6d5a8" stroke-width="1.6"/>
<text x="381" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">DC-DC converter</text>
<text x="381" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">non-isolated, 29 V → 5 V</text>
<text x="381" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">module: max 30 V</text>
<line x1="466" y1="214" x2="518" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="494" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">5 V</text>
<rect x="522" y="168" width="176" height="92" rx="9" fill="#f4f7fd" stroke="#cbd2db" stroke-width="1.6"/>
<text x="610" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">B0505S-1W</text>
<text x="610" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">isolating brick</text>
<text x="610" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">5 V → 5 V, 1 W</text>
<line x1="698" y1="214" x2="750" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="726" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">5 V</text>
<rect x="754" y="168" width="156" height="92" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="832" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">ESP32-S3</text>
<text x="832" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">the probe</text>
<text x="832" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">about 1 W</text>
<line x1="910" y1="214" x2="962" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="938" y="202" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">USB-C</text>
<rect x="966" y="168" width="134" height="92" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="1033" y="202" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">Target device</text>
<text x="1033" y="222" font-size="11.5" fill="#7c8493" text-anchor="middle">OpenKNX</text>
<text x="1033" y="240" font-size="11.5" fill="#8a6100" text-anchor="middle">bus powered</text>
<rect x="512" y="300" width="196" height="46" rx="7" fill="#f2faf5" stroke="#bfe3cd" stroke-width="1.4"/>
<text x="610" y="320" font-size="12" font-weight="600" fill="#1a7f4b" text-anchor="middle">measured: 4.9 V under load</text>
<text x="610" y="337" font-size="10.5" fill="#5d7d6b" text-anchor="middle">accuracy not critical</text>
<circle cx="48" cy="376" r="3.5" fill="#1f6feb"/>
<text x="62" y="380" font-size="11.5" font-weight="600" fill="#16181d">Why the Schottky</text>
<text x="230" y="380" font-size="11" fill="#7c8493">No back-feeding. KNX transmits by briefly pulling the bus LOW — no charge may flow back</text>
<text x="230" y="401" font-size="11" fill="#7c8493">out of the DC-DC input capacitor while that happens.</text>
<circle cx="48" cy="418" r="3.5" fill="#1f6feb"/>
<text x="62" y="422" font-size="11.5" font-weight="600" fill="#16181d">Why the isolation</text>
<text x="230" y="422" font-size="11" fill="#7c8493">Breaks the ground loop between bus supply and target. The only ground reference: the USB cable.</text>
<circle cx="48" cy="439" r="3.5" fill="#1f6feb"/>
<text x="62" y="443" font-size="11.5" font-weight="600" fill="#16181d">Voltage not critical</text>
<text x="230" y="443" font-size="11" fill="#7c8493">Anything above roughly 4 V is enough. VBUS is only a detection signal; the target hangs on the bus.</text>
<circle cx="48" cy="460" r="3.5" fill="#1f6feb"/>
<text x="62" y="464" font-size="11.5" font-weight="600" fill="#16181d">Offen: >40 V required</text>
<text x="230" y="464" font-size="11" fill="#7c8493">So the probe can run on red/black as well as yellow/white. The current module is rated 30 V</text>
<text x="230" y="485" font-size="11" fill="#7c8493">absolute maximum — no margin on a 29 V bus. The SK54 (40 V) then gets tight as well.</text>
<circle cx="48" cy="502" r="3.5" fill="#1f6feb"/>
<text x="62" y="506" font-size="11.5" font-weight="600" fill="#16181d">Power limit</text>
<text x="230" y="506" font-size="11" fill="#7c8493">1 W from the B0505 against roughly 1 W needed by the S3. Not enough for a USB-powered target.</text>
</svg>