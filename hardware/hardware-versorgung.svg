<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/></marker></defs>
<rect width="1200" height="620" fill="#ffffff"/>

<text x="40" y="42" font-size="20" font-weight="600" fill="#16181d">DebugProbe — Power supply</text>
<text x="40" y="64" font-size="13" fill="#6b7280">Two sources, one controller: KNX bus with galvanic isolation, or a Li-ion cell with protection circuit</text>

<!-- Trennstelle: gilt nur fuer den Buspfad -->
<text x="790" y="108" font-size="12" font-weight="600" fill="#b3261e" text-anchor="middle">galvanic isolation</text>
<line x1="790" y1="118" x2="790" y2="310" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="804" y="136" font-size="11" fill="#c4736c">bus side</text>

<!-- ================= KNX-Pfad ================= -->
<rect x="40" y="150" width="130" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="105" y="180" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">P1 · KNX terminal</text>
<text x="105" y="200" font-size="11.5" fill="#7c8493" text-anchor="middle">red/black or</text>
<text x="105" y="218" font-size="11.5" fill="#8a6100" text-anchor="middle">yellow/white</text>

<line x1="170" y1="192" x2="200" y2="192" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="185" y="180" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">29 V</text>

<rect x="204" y="150" width="150" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="279" y="180" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">D1 · R1</text>
<text x="279" y="200" font-size="11.5" fill="#7c8493" text-anchor="middle">no back-feeding</text>
<text x="279" y="218" font-size="11.5" fill="#7c8493" text-anchor="middle">inrush limiter 100 Ω</text>

<line x1="354" y1="192" x2="384" y2="192" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

<rect x="388" y="150" width="180" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="478" y="180" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">U1 · XL1509-5.0</text>
<text x="478" y="200" font-size="11.5" fill="#7c8493" text-anchor="middle">Buck 29 V → 5 V, 150 kHz</text>
<text x="478" y="218" font-size="11.5" fill="#7c8493" text-anchor="middle">with D2 · L1 100 µH</text>

<line x1="568" y1="192" x2="598" y2="192" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="583" y="180" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">5 V</text>

<rect x="602" y="150" width="150" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="677" y="180" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">A1 · B0505S-1W</text>
<text x="677" y="200" font-size="11.5" fill="#7c8493" text-anchor="middle">isolated, 1 W</text>
<text x="677" y="218" font-size="11.5" fill="#7c8493" text-anchor="middle">max. 200 mA</text>

<line x1="752" y1="192" x2="816" y2="192" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

<!-- ================= Controller ================= -->
<rect x="820" y="150" width="185" height="320" rx="9" fill="#f4f6f8" stroke="#9aa4b2" stroke-width="1.8"/>
<text x="912" y="182" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">U2 · ESP32-S3</text>
<text x="912" y="202" font-size="11.5" fill="#7c8493" text-anchor="middle">SuperMini, FH4R2</text>
<line x1="845" y1="216" x2="980" y2="216" stroke="#cbd2db" stroke-width="1.2"/>
<text x="912" y="240" font-size="11.5" fill="#7c8493" text-anchor="middle">5V  ← bus path</text>
<text x="912" y="262" font-size="11.5" fill="#7c8493" text-anchor="middle">B+ / B−  ← battery</text>
<text x="912" y="284" font-size="11.5" fill="#7c8493" text-anchor="middle">GPIO5  ← BatMon</text>
<text x="912" y="306" font-size="11.5" fill="#7c8493" text-anchor="middle">GPIO48 → RGB-LED</text>
<line x1="845" y1="330" x2="980" y2="330" stroke="#cbd2db" stroke-width="1.2"/>
<text x="912" y="356" font-size="11.5" fill="#7c8493" text-anchor="middle">module's own USB-C,</text>
<text x="912" y="374" font-size="11.5" fill="#7c8493" text-anchor="middle">operated as host</text>
<text x="912" y="404" font-size="11.5" fill="#7c8493" text-anchor="middle">supplies no VBUS</text>

<line x1="1005" y1="360" x2="1039" y2="360" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="1022" y="348" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">USB</text>

<rect x="1043" y="318" width="120" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="1103" y="348" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">Target device</text>
<text x="1103" y="368" font-size="11.5" fill="#7c8493" text-anchor="middle">RP2040 or</text>
<text x="1103" y="386" font-size="11.5" fill="#7c8493" text-anchor="middle">ESP32, bus powered</text>

<!-- ================= Akkupfad ================= -->
<rect x="40" y="386" width="130" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="105" y="416" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">J2 · Cell</text>
<text x="105" y="436" font-size="11.5" fill="#7c8493" text-anchor="middle">Li-ion, without</text>
<text x="105" y="454" font-size="11.5" fill="#7c8493" text-anchor="middle">its own protection PCB</text>

<line x1="170" y1="428" x2="200" y2="428" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

<rect x="204" y="386" width="130" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="269" y="416" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">J1 · Switch</text>
<text x="269" y="436" font-size="11.5" fill="#7c8493" text-anchor="middle">in the cell positive,</text>
<text x="269" y="454" font-size="11.5" fill="#7c8493" text-anchor="middle">ahead of the protection</text>

<line x1="334" y1="428" x2="364" y2="428" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

<rect x="368" y="386" width="200" height="84" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="468" y="416" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">IC1 · FS312F-G</text>
<text x="468" y="436" font-size="11.5" fill="#7c8493" text-anchor="middle">with Q1 · Q2 AO3400A</text>
<text x="468" y="454" font-size="11.5" fill="#8a6100" text-anchor="middle">over-discharge 2.90 V</text>

<line x1="568" y1="428" x2="816" y2="428" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="692" y="416" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">B+ / B−</text>

<!-- Teiler haengt am geschalteten Zellen-Plus -->
<line x1="269" y1="470" x2="269" y2="524" stroke="#4b5563" stroke-width="2"/>
<line x1="269" y1="524" x2="364" y2="524" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

<rect x="368" y="496" width="200" height="60" rx="9" fill="#f9fafb" stroke="#cbd2db" stroke-width="1.6"/>
<text x="468" y="522" font-size="13" font-weight="600" fill="#16181d" text-anchor="middle">R5 · R6 · C9</text>
<text x="468" y="542" font-size="11.5" fill="#7c8493" text-anchor="middle">1 MΩ / 1 MΩ, 10 µF</text>

<line x1="568" y1="526" x2="860" y2="526" stroke="#4b5563" stroke-width="2"/>
<line x1="860" y1="526" x2="860" y2="474" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="514" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">GPIO5</text>

<text x="40" y="592" font-size="11.5" fill="#9aa4b2">The battery path sits behind the isolation, on the same side as controller and target. Both sources feed U2, but on different pins.</text>
</svg>
